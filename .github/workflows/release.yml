name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@^11.15.0

      - name: Validate release source and version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          package_version="$(node --print "require('./package.json').version")"

          if [[ "$tag" != "v$package_version" ]]; then
            echo "Release tag $tag must exactly match package.json version v$package_version." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not contained in main." >&2
            exit 1
          fi

          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            dist_tag="next"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            dist_tag="latest"
          else
            echo "Unsupported release version: $version" >&2
            echo "Use x.y.z or x.y.z-rc.n." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Validate package
        run: npm run validate

      - name: Preview published package
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public --tag "${{ steps.release.outputs.dist-tag }}" --provenance
        env:
          # Only needed for the one-time first-package bootstrap. npm trusted
          # publishing uses OIDC first and ignores this fallback once configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
